name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests (fast, no Docker required)
        run: dotnet test tests/KhoiProjectManagement.UnitTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      # ubuntu-latest runners have Docker preinstalled, so Testcontainers.PostgreSql works with no
      # extra service-container setup - each project spins up its own throwaway Postgres 16 container.
      - name: Integration tests (Testcontainers Postgres)
        run: dotnet test tests/KhoiProjectManagement.IntegrationTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Functional tests (Testcontainers Postgres)
        run: dotnet test tests/KhoiProjectManagement.FunctionalTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      # Coverage gate: merges all three projects' cobertura output (coverlet.runsettings already
      # excludes generated migrations/model-snapshot/Program bootstrap so the number reflects actual
      # business logic, not auto-generated lines "covered" just by MigrateAsync() running them) and
      # fails the build below 25% line coverage - a regression floor a few points under the ~34%
      # measured baseline as of this pass, not an aspirational target. Raise it as real coverage grows.
      - name: Coverage gate
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator "-reports:tests/**/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-merged" "-reporttypes:TextSummary"
          cat coverage-merged/Summary.txt
          LINE_COVERAGE=$(grep "Line coverage:" coverage-merged/Summary.txt | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Combined backend line coverage: ${LINE_COVERAGE}%"
          awk -v cov="$LINE_COVERAGE" 'BEGIN { exit !(cov >= 25) }' || { echo "Coverage ${LINE_COVERAGE}% is below the 25% floor"; exit 1; }

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            **/TestResults/**/coverage.cobertura.xml
            coverage-merged/Summary.txt
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KhoiProjectManagementApp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: KhoiProjectManagementApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: KhoiProjectManagementApp/coverage
          retention-days: 14

  # Heaviest job - a real Postgres + a real dotnet API + a real browser - kept off the default PR path
  # so normal CI stays fast; runs on push to master and on manual dispatch.
  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khoi_dev
          POSTGRES_PASSWORD: khoi_dev_local_only
          POSTGRES_DB: ProjectManagementDB
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: KhoiProjectManagementApp/package-lock.json

      - name: Start API (migrates + seeds on boot)
        working-directory: KhoiProjectManagementApi
        run: |
          nohup dotnet run --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5278/swagger/index.html > /dev/null && exit 0
            sleep 2
          done
          echo "API did not become ready in time"; cat api.log; exit 1
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5278

      - name: Install frontend dependencies
        working-directory: KhoiProjectManagementApp
        run: npm ci

      - name: Install Playwright browsers
        working-directory: KhoiProjectManagementApp
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: KhoiProjectManagementApp
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: KhoiProjectManagementApp/playwright-report
          retention-days: 14
