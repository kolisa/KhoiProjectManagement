name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests (fast, no Docker required)
        run: dotnet test tests/KhoiProjectManagement.UnitTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Architecture tests (layer-dependency rules, no Docker required)
        run: dotnet test tests/KhoiProjectManagement.ArchitectureTests --no-build --configuration Release

      # ubuntu-latest runners have Docker preinstalled, so Testcontainers.PostgreSql works with no
      # extra service-container setup - each project spins up its own throwaway Postgres 16 container.
      - name: Integration tests (Testcontainers Postgres)
        run: dotnet test tests/KhoiProjectManagement.IntegrationTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Functional tests (Testcontainers Postgres)
        run: dotnet test tests/KhoiProjectManagement.FunctionalTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      # Coverage gate: merges all three projects' cobertura output (coverlet.runsettings already
      # excludes generated migrations/model-snapshot/Program bootstrap so the number reflects actual
      # business logic, not auto-generated lines "covered" just by MigrateAsync() running them) and
      # fails the build below 25% line coverage - a regression floor a few points under the ~34%
      # measured baseline as of this pass, not an aspirational target. Raise it as real coverage grows.
      - name: Coverage gate
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator "-reports:tests/**/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-merged" "-reporttypes:TextSummary"
          cat coverage-merged/Summary.txt
          LINE_COVERAGE=$(grep "Line coverage:" coverage-merged/Summary.txt | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Combined backend line coverage: ${LINE_COVERAGE}%"
          awk -v cov="$LINE_COVERAGE" 'BEGIN { exit !(cov >= 25) }' || { echo "Coverage ${LINE_COVERAGE}% is below the 25% floor"; exit 1; }

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: |
            **/TestResults/**/coverage.cobertura.xml
            coverage-merged/Summary.txt
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KhoiProjectManagementApp
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: KhoiProjectManagementApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: KhoiProjectManagementApp/coverage
          retention-days: 14

  # Heaviest job - a real Postgres + a real dotnet API + a real browser - kept off the default PR path
  # so normal CI stays fast; runs on push to master and on manual dispatch.
  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khoi_dev
          POSTGRES_PASSWORD: khoi_dev_local_only
          POSTGRES_DB: ProjectManagementDB
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: KhoiProjectManagementApp/package-lock.json

      - name: Start API (migrates + seeds on boot)
        working-directory: KhoiProjectManagementApi
        run: |
          nohup dotnet run --no-launch-profile > api.log 2>&1 &
          # 90*2s = 3min budget. Every fresh Testcontainers Postgres applies the full migration
          # history from scratch (unlike a real deployment's incremental few), so this window's
          # actual margin shrinks a little with every migration this repo ever adds - the previous
          # 30*2s=60s budget was hit almost exactly (app logged "Application started" 1s after the
          # loop gave up) once the count reached 28, not because the API failed to come up.
          for i in $(seq 1 90); do
            curl -sf http://localhost:5278/swagger/index.html > /dev/null && exit 0
            sleep 2
          done
          echo "API did not become ready in time"; cat api.log; exit 1
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5278

      - name: Install frontend dependencies
        working-directory: KhoiProjectManagementApp
        run: npm ci

      - name: Install Playwright browsers
        working-directory: KhoiProjectManagementApp
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: KhoiProjectManagementApp
        run: npx playwright test
        env:
          # .env.local (which normally supplies this for local dev) is gitignored and not present in
          # CI's checkout - without this, ApiService.js falls back to its https://localhost:7148/api
          # default, which doesn't match the API this job actually started on port 5278.
          VITE_API_URL: http://localhost:5278/api

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: KhoiProjectManagementApp/playwright-report
          retention-days: 14

  # Deploys the backend to the Linux production server once every prior job on this push to master
  # has passed. Mirrors the (now-retired) manual process exactly: stop the service, wipe the old
  # binaries in /var/www/khoi-api (never touching /etc/khoi-api/khoi-api.env - that file holds every
  # production-specific setting now, including what used to be a manually-maintained
  # appsettings.Production.json outside git; this workflow never generates or uploads one), publish
  # fresh, upload, fix ownership, reload systemd, restart, and verify. `App:AutoMigrateOnStartup` is
  # deliberately `true` in that env file (unlike this repo's documented default recommendation of
  # `false` for a production database) - a considered choice, not an oversight, so EF Core migrations
  # apply automatically on every restart this job triggers.
  deploy:
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: dotnet publish KhoiProjectManagementApi --configuration Release --output ./publish

      # Framework-dependent publish output always includes appsettings.Development.json - harmless
      # (ASPNETCORE_ENVIRONMENT=Production means it's never loaded) but no reason to ship it.
      - name: Remove dev config from publish output
        run: rm -f ./publish/appsettings.Development.json

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned to the server's actual host key rather than accepting on first connect (which
          # would trust whatever key answers on that IP with no verification at all).
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICTg594fCP01BbE+2qlAskc6B1XJBS5mnqGouW74GuD6" > ~/.ssh/known_hosts

      - name: Stop service and clear old binaries
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key root@$DEPLOY_HOST "systemctl stop khoi-api && rm -rf /var/www/khoi-api/*"

      - name: Upload new build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -r ./publish/* root@$DEPLOY_HOST:/var/www/khoi-api/

      - name: Fix permissions, reload, and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key root@$DEPLOY_HOST '
            set -e
            test -f /var/www/khoi-api/KhoiProjectManagementApi.dll
            chown -R www-data:www-data /var/www/khoi-api
            chown root:www-data /etc/khoi-api/khoi-api.env
            chmod 640 /etc/khoi-api/khoi-api.env
            systemctl daemon-reload
            systemctl restart khoi-api
            sleep 3
            systemctl status khoi-api --no-pager
          '

      # No dedicated health-check endpoint exists in this API - Swagger is confirmed enabled in
      # Production (Program.cs), so its own page is the closest thing to one available today.
      - name: Verify the API actually came back up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 15); do
            curl -sf http://$DEPLOY_HOST/swagger/index.html > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "API did not respond within 30s of restart - check 'systemctl status khoi-api' and 'journalctl -u khoi-api' on the server"
          exit 1
